<body class="bg-background min-h-screen flex items-center justify-center p-md font-body-md text-body-md text-on-surface">
<main class="w-full max-w-[400px]">
<!-- Brand / Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-primary text-on-primary mb-md">
<span class="material-symbols-outlined" data-weight="fill">task_alt</span>
</div>
<h1 class="font-display text-display text-on-surface">Welcome Back</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-sm">Sign in to continue to Task Manager</p>
</div>
<!-- Form Card -->
<form class="bg-surface-container-lowest rounded-[12px] p-lg border border-[#f1f5f9] flex flex-col gap-stack-gap">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-sm" for="email">Email</label>
<input class="w-full bg-surface-container-low border-none rounded-[12px] px-md py-[14px] font-body-md text-body-md text-on-surface placeholder:text-outline transition-shadow" id="email" placeholder="name@company.com" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-sm" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-[12px] px-md py-[14px] font-body-md text-body-md text-on-surface placeholder:text-outline transition-shadow" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-sm top-1/2 -translate-y-1/2 p-sm text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<div class="flex justify-end mt-sm">
<a class="font-body-md text-body-md text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
</div>
<button class="w-full bg-primary text-on-primary rounded-[12px] py-[14px] font-headline-md text-headline-md mt-sm scale-98 active:scale-95 transition-transform duration-200 hover:bg-surface-tint" type="submit">
                Sign In
            </button>
</form>
<!-- Footer Link -->
<div class="text-center mt-xl">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary hover:text-primary-fixed-dim transition-colors font-headline-md text-headline-md" href="#">Sign up</a>
</p>
</div>
</main>
<script>
        // Simple password toggle interaction
        const pwdInput = document.getElementById('password');
        const toggleBtn = pwdInput.nextElementSibling;
        const toggleIcon = toggleBtn.querySelector('.material-symbols-outlined');

        toggleBtn.addEventListener('click', () => {
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleIcon.textContent = 'visibility';
            } else {
                pwdInput.type = 'password';
                toggleIcon.textContent = 'visibility_off';
            }
        });
    </script>
</body></html>
